   <g id="text_2">
    <text style="fill:#2e6fb6;font-family:Arial;font-size:6.7px;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 141.1344, 76.067595)" x="141.1344" y="76.067595">Study A — current</text>
   </g>
   <g id="text_3">
    <text style="fill:#20364d;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 90.9144, 110.432565)" x="90.9144" y="110.432565">Design &amp; fidelity</text>
   </g>
   <g id="text_4">
    <text style="fill:#2e6fb6;font-family:Arial;font-size:6.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 90.9144, 128.248504)" x="90.9144" y="128.248504">Artifact</text>
   </g>
   <g id="text_5">
    <text style="fill:#20364d;font-family:Arial;font-size:5.9px;font-style:normal;font-weight:normal;" transform="translate(90.9144 150.779877)">ADRs · source contracts · schemas</text>
    <text style="fill:#20364d;font-family:Arial;font-size:5.9px;font-style:normal;font-weight:normal;" transform="translate(90.9144 156.766846)">· targeted tests</text>
   </g>
   <g id="text_6">
    <text style="fill:#66788a;font-family:Arial;font-size:6.2px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 90.9144, 182.27907)" x="90.9144" y="182.27907">Claim ceiling</text>
   </g>
   <g id="text_7">
    <text style="fill:#20364d;font-family:Arial;font-size:6.25px;font-style:normal;font-weight:normal;" transform="translate(90.9144 195.876218)">Mechanisms are executable and</text>
    <text style="fill:#20364d;font-family:Arial;font-size:6.25px;font-style:normal;font-weight:normal;" transform="translate(90.9144 202.218347)">auditable</text>
   </g>
   <g id="text_8">
    <text style="fill:#14868b;font-family:Arial;font-size:6.7px;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 271.7064, 76.067595)" x="271.7064" y="76.067595">Study B — next</text>
   </g>
   <g id="text_9">
    <text style="fill:#20364d;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 221.4864, 110.432565)" x="221.4864" y="110.432565">Classroom feasibility</text>
   </g>
   <g id="text_10">
    <text style="fill:#14868b;font-family:Arial;font-size:6.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 221.4864, 128.248504)" x="221.4864" y="128.248504">2–4 classes</text>
   </g>
   <g id="text_11">
    <text style="fill:#20364d;font-family:Arial;font-size:5.9px;font-style:normal;font-weight:normal;" transform="translate(221.4864 147.855533)">logs · versions · observation ·</text>
    <text style="fill:#20364d;font-family:Arial;font-size:5.9px;font-style:normal;font-weight:normal;" transform="translate(221.4864 153.911643)">interviews · stimulated recall ·</text>
    <text style="fill:#20364d;font-family:Arial;font-size:5.9px;font-style:normal;font-weight:normal;" transform="translate(221.4864 159.898613)">adverse events</text>
   </g>
   <g id="text_12">
    <text style="fill:#66788a;font-family:Arial;font-size:6.2px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 221.4864, 182.27907)" x="221.4864" y="182.27907">Claim ceiling</text>
   </g>
   <g id="text_13">
    <text style="fill:#20364d;font-family:Arial;font-size:6.25px;font-style:normal;font-weight:normal;" transform="translate(221.4864 195.876218)">Mechanisms are understandable</text>
    <text style="fill:#20364d;font-family:Arial;font-size:6.25px;font-style:normal;font-weight:normal;" transform="translate(221.4864 202.218347)">and enacted</text>
   </g>
   <g id="text_14">
    <text style="fill:#7156a4;font-family:Arial;font-size:6.7px;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 402.2784, 76.067595)" x="402.2784" y="76.067595">Study C — later</text>
   </g>
   <g id="text_15">
    <text style="fill:#20364d;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 352.0584, 110.481784)" x="352.0584" y="110.481784">Comparative effects</text>
   </g>
   <g id="text_16">
    <text style="fill:#7156a4;font-family:Arial;font-size:6.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 352.0584, 128.248504)" x="352.0584" y="128.248504">Cluster-randomised / matched</text>
   </g>
   <g id="text_17">
    <text style="fill:#20364d;font-family:Arial;font-size:5.9px;font-style:normal;font-weight:normal;" transform="translate(352.0584 150.774843)">generic GenAI vs guarded no-edit</text>
    <text style="fill:#20364d;font-family:Arial;font-size:5.9px;font-style:normal;font-weight:normal;" transform="translate(352.0584 156.912927)">vs full reversible delegation</text>
   </g>
   <g id="text_18">
    <text style="fill:#66788a;font-family:Arial;font-size:6.2px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 352.0584, 182.241289)" x="352.0584" y="182.241289">Primary outcome</text>
   </g>
   <g id="text_19">
    <text style="fill:#20364d;font-family:Arial;font-size:6.25px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 352.0584, 199.048747)" x="352.0584" y="199.048747">Delayed unaided transfer</text>
   </g>
   <g id="text_20">
    <text style="fill:#b95043;font-family:Arial;font-size:7.3px;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 265.68, 233.572055)" x="265.68" y="233.572055">Evidence must advance before claims advance</text>
   </g>
   <g id="text_21">
    <text style="fill:#66788a;font-family:Arial;font-size:6.15px;font-style:normal;font-weight:normal;" transform="translate(159.041402 239.275302)">implementation fidelity  →  enactment / feasibility  →  mechanism evidence  →</text>
    <text style="fill:#66788a;font-family:Arial;font-size:6.15px;font-style:normal;font-weight:normal;" transform="translate(225.68434 245.673474)">learning and workload effects</text>
   </g>
   <g id="text_22">
    <text style="fill:#66788a;font-family:Arial;font-size:6.6px;font-style:normal;font-weight:normal;" transform="translate(90.884672 280.180184)">Pre-register outcomes and adverse events; freeze code, prompts, model versions, schemas, and data definitions before</text>
    <text style="fill:#66788a;font-family:Arial;font-size:6.6px;font-style:normal;font-weight:normal;" transform="translate(231.750844 286.954816)">classroom deployment.</text>
   </g>
  </g>
