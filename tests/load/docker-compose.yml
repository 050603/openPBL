name: openpbl-load

x-k6: &k6
  image: grafana/k6:2.0.0
  working_dir: /tests
  environment:
    BASE_URL: ${BASE_URL:?Set BASE_URL to the candidate HTTPS URL}
    LOAD_TEST_ADMIN_TOKEN: ${LOAD_TEST_ADMIN_TOKEN:?Set LOAD_TEST_ADMIN_TOKEN}
    GIT_SHA: ${GIT_SHA:-unknown}
    IMAGE_VERSION: ${IMAGE_VERSION:-unknown}
    SERVER_SPECS: ${SERVER_SPECS:-unknown}
    K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-}
  volumes:
    - ./:/tests:ro
    - ./reports:/reports

services:
  smoke:
    <<: *k6
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL}
      LOAD_TEST_ADMIN_TOKEN: ${LOAD_TEST_ADMIN_TOKEN:?Set LOAD_TEST_ADMIN_TOKEN}
      SCENARIO: smoke
      GIT_SHA: ${GIT_SHA:-unknown}
      IMAGE_VERSION: ${IMAGE_VERSION:-unknown}
      SERVER_SPECS: ${SERVER_SPECS:-unknown}
    command: ["run", "--out", "json=/reports/smoke-raw.json", "/tests/main.js"]

  target:
    <<: *k6
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL}
      LOAD_TEST_ADMIN_TOKEN: ${LOAD_TEST_ADMIN_TOKEN:?Set LOAD_TEST_ADMIN_TOKEN}
      SCENARIO: target
      GIT_SHA: ${GIT_SHA:-unknown}
      IMAGE_VERSION: ${IMAGE_VERSION:-unknown}
      SERVER_SPECS: ${SERVER_SPECS:-unknown}
    command: ["run", "--out", "json=/reports/target-raw.json", "/tests/main.js"]

  stress:
    <<: *k6
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL}
      LOAD_TEST_ADMIN_TOKEN: ${LOAD_TEST_ADMIN_TOKEN:?Set LOAD_TEST_ADMIN_TOKEN}
      SCENARIO: stress
      GIT_SHA: ${GIT_SHA:-unknown}
      IMAGE_VERSION: ${IMAGE_VERSION:-unknown}
      SERVER_SPECS: ${SERVER_SPECS:-unknown}
    command: ["run", "--out", "json=/reports/stress-raw.json", "/tests/main.js"]

  soak:
    <<: *k6
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL}
      LOAD_TEST_ADMIN_TOKEN: ${LOAD_TEST_ADMIN_TOKEN:?Set LOAD_TEST_ADMIN_TOKEN}
      SCENARIO: soak
      GIT_SHA: ${GIT_SHA:-unknown}
      IMAGE_VERSION: ${IMAGE_VERSION:-unknown}
      SERVER_SPECS: ${SERVER_SPECS:-unknown}
    command: ["run", "--out", "json=/reports/soak-raw.json", "/tests/main.js"]
